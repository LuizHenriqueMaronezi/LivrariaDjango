<!DOCTYPE html>

<head><title>Detalhes</title></head>

<header><h2>{{ livro.titulo }}</h2></header>


<div class="campo_livro">
    <strong>Preço: </strong>
    <span>R${{ livro.preco }}</span>
</div>

<div class="campo_livro">
    <strong>Data de Publicação: </strong>
    <span>{{ livro.data_publicacao }}</span>
</div>

<div class="campo_livro">
    <strong>Autor: </strong>
    <span>{{ livro.autor.nome }}</span>
</div>

<div class="campo_livro">
    <strong>Gênero: </strong>
    <span>{{ livro.get_genero_display }}</span>
</div>

<br>

<a href="{% url 'pagina_inicial' %}">Voltar</a>
